# 空港の観測（METAR）を1時間ごとに保存しておく
# ・地球儀の時計は「GFS の有効時刻」で、公開の時点では少し前になる
# ・観測は「時計より前で一番新しいもの」を使うので、その時刻の観測を先に取っておく
# ・保存先は Actions のキャッシュ（リポジトリには何もコミットしない。7日で自動的に消える）
name: 観測の保存（METAR）

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_metar.py", ".github/workflows/snapshot-metar.yml"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: key
        run: echo "hour=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - name: METAR を取得して保存形式に
        run: python scripts/fetch_metar.py snapshot --out obs/metar.json
      - uses: actions/cache/save@v6
        with:
          path: obs
          key: metar-${{ steps.key.outputs.hour }}

