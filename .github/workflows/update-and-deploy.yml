# 地球儀：最新の GFS を取りに行き、ページと一緒に GitHub Pages へ出す
# ・リポジトリにはデータをコミットしない（履歴が太らない）
# ・取得に失敗しても公開は続ける（ページはサンプルで動く）
name: データ更新と公開

on:
  schedule:
    # GFS は 00/06/12/18 UTC の実行。+3時間の結果が出そろう頃（約4時間後）に取りに行く
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:        # 手動で今すぐ実行
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 道具を入れる（GRIB2 を読む eccodes）
        run: pip install eccodes numpy

      - name: ページを組み立てる
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          cp -r data _site/

      - name: 最新の GFS（風・降水）を取得して変換
        continue-on-error: true
        run: python scripts/fetch_gfs.py --out _site/data/latest

      - name: 時計の時刻を読む
        id: clock
        continue-on-error: true
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m = json.load(open("_site/data/latest/manifest.json"))
          t = m["layers"]["wind-10m"]["meta"]["validTime"]
          import datetime as dt
          c = dt.datetime.fromisoformat(t.replace("Z", "+00:00"))
          print("hour=" + c.strftime("%Y%m%d%H"))
          print("prev=" + (c - dt.timedelta(hours=1)).strftime("%Y%m%d%H"))
          PY

      # 保存は1時間ごと。時計の時刻の回と、その1時間前の回の両方を使う（保存が遅れた回の穴を埋める）
      - name: その時刻に保存しておいた空港の観測を探す
        if: steps.clock.outputs.hour != ''
        uses: actions/cache/restore@v6
        with:
          path: obs
          key: metar-${{ steps.clock.outputs.hour }}

      - name: 1時間前の保存分も探す
        if: steps.clock.outputs.prev != ''
        run: mkdir -p obs && mv obs obs_now
      - if: steps.clock.outputs.prev != ''
        uses: actions/cache/restore@v6
        with:
          path: obs
          key: metar-${{ steps.clock.outputs.prev }}
      - if: steps.clock.outputs.prev != ''
        run: mkdir -p obs && mv obs obs_prev

      - name: 空港の観測を地球儀に付ける（時計より後の観測は落とす）
        continue-on-error: true
        run: python scripts/fetch_metar.py attach --snapshot obs_now/metar.json obs_prev/metar.json --latest _site/data/latest

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
