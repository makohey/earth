# 地球儀：最新の GFS を取りに行き、ページと一緒に GitHub Pages へ出す
# ・リポジトリにはデータをコミットしない（履歴が太らない）
# ・取得に失敗しても公開は続ける（ページはサンプルで動く）
name: データ更新と公開

on:
  schedule:
    # GFS は 00/06/12/18 UTC の実行。始まって約2時間半後に起動し、
    # 空港の観測を集めながら、その回の「+3時間」の結果が出るのを待つ（出るのは約3.5〜4.5時間後）
    - cron: "30 2,8,14,20 * * *"
  workflow_dispatch:        # 手動で今すぐ実行
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 道具を入れる（GRIB2 を読む eccodes）
        run: pip install eccodes numpy

      - name: ページを組み立てる
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          cp -r data _site/

      # 定時の実行：観測を集めながらその回の GFS を待つ（最大2時間半）
      - name: 観測を集めながら、その回の GFS を待って変換
        if: github.event_name == 'schedule'
        timeout-minutes: 170
        run: bash scripts/collect_and_wait.sh _site/data/latest 150

      # 手動・コード更新のとき：待たずに、今出ている最新の回で作り直す
      # （観測は今取るので、時計より後のものは落ち、点はほぼ出ない。定時の実行で付く）
      - name: 今出ている最新の GFS で作り直す
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          python scripts/fetch_gfs.py --out _site/data/latest
          python scripts/fetch_metar.py snapshot --out obs/metar_now.json || true
          python scripts/fetch_metar.py attach --snapshot obs/metar_now.json --latest _site/data/latest || true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開だけは一度に一つ（待っている定時の実行が、コード更新の公開を止めないように build 側には付けない）
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        
