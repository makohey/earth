# 地球儀：最新の GFS を取りに行き、ページと一緒に GitHub Pages へ出す
# ・リポジトリにはデータをコミットしない（履歴が太らない）
# ・取得に失敗しても公開は続ける（ページはサンプルで動く）
name: データ更新と公開

on:
  schedule:
    # GFS は 00/06/12/18 UTC の実行。+3時間の結果が出そろう頃（約4時間後）に取りに行く
    # GitHub の時間指定は遅れたり飛んだりするので「だいたいその頃」と考える
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:        # 手動で今すぐ実行
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 道具を入れる（GRIB2 を読む eccodes）
        run: pip install eccodes numpy netCDF4 sgp4

      - name: ページを組み立てる
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          cp -r data _site/

      # 同じデータを取り直さない：前回取った「最新データ一式」を置き場（キャッシュ）から戻す。
      # コードを直して送った（push）ときは、6時間以内の一式があればそれを使い、外へは取りに行かない。
      # 定時・手動のときは、いつも通り取りに行く（水源への取得は1日4回のまま）
      - uses: actions/cache/restore@v6
        with:
          path: saved_latest
          key: latest-${{ github.run_id }}
          restore-keys: latest-
      - id: reuse
        name: 取りに行くかどうかを決める
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, shutil
          m = "saved_latest/manifest.json"
          age = None
          if os.path.exists(m):
              g = json.load(open(m, encoding="utf-8")).get("generatedAt")
              if g:
                  age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(g.replace("Z", "+00:00"))).total_seconds() / 3600
          hit = os.environ["EVENT"] == "push" and age is not None and age < 6
          if hit:
              shutil.copytree("saved_latest", "_site/data/latest")
          msg = f"前回の一式を使う（{age:.1f}時間前に取得・外へは取りに行かない）" if hit else ("新しく取りに行く" + (f"（前回の一式は{age:.1f}時間前）" if age is not None else "（前回の一式なし）"))
          print(f"::notice::データ取得: {os.environ['EVENT']} → {msg}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"hit={'true' if hit else 'false'}\n")
          PY

      - name: 最新の GFS（風・降水・気圧）を取得して変換
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_gfs.py --out _site/data/latest

      - name: 全球の衛星赤外画像（GMGSI）を、時計の時刻以前で一番新しいものから
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_gmgsi.py --latest _site/data/latest

      - name: 最近の地震（USGS、過去7日・M2.5以上）
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_quakes.py --latest _site/data/latest

      # 海面水温の平年差：日ごとのデータなので、取った日のファイルをキャッシュに残し、同じ日は取り直さない
      - id: today
        if: steps.reuse.outputs.hit != 'true'
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.reuse.outputs.hit != 'true'
        with:
          path: oisst_cache
          key: oisst-${{ steps.today.outputs.day }}
          restore-keys: oisst-
      - name: 海面水温の平年差（NOAA OISST、1日1枚）
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_oisst.py --latest _site/data/latest --cache oisst_cache

      - name: 人工衛星の位置（CelesTrak の軌道要素を5回に分けて取り、SGP4 で計算）
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_sats.py --latest _site/data/latest

      # 火山と揺れの波紋：自分の置き場を持ち、取ったものは取り直さない（同じ月の一覧・同じ日の週報・同じ地震の ShakeMap）。
      # だから push でも走らせてよい（置き場にない新しい分だけを取りに行く）
      - uses: actions/cache/restore@v6
        with:
          path: volc_cache
          key: volc-${{ github.run_id }}
          restore-keys: volc-
      - name: 火山（スミソニアン GVP：一覧は月1回、週報は1日1回まで）
        continue-on-error: true
        run: python scripts/fetch_volcanoes.py --latest _site/data/latest --cache volc_cache
      - uses: actions/cache/restore@v6
        with:
          path: shake_cache
          key: shake-${{ github.run_id }}
          restore-keys: shake-
      - name: 揺れが広がった範囲（USGS ShakeMap、M5以上・新しい地震だけ）
        continue-on-error: true
        run: python scripts/fetch_shakemaps.py --latest _site/data/latest --cache shake_cache
      - uses: actions/cache/save@v6
        if: hashFiles('volc_cache/*') != ''
        with:
          path: volc_cache
          key: volc-${{ github.run_id }}
      - uses: actions/cache/save@v6
        if: hashFiles('shake_cache/*') != ''
        with:
          path: shake_cache
          key: shake-${{ github.run_id }}

      # 一式を置き場に残す（次にコードを送ったとき、これを使う）。push で火山などを足した分も含めて残す。一式が作れなかったときは残さない
      - name: 取った一式を置き場へ
        if: hashFiles('_site/data/latest/manifest.json') != ''
        run: rm -rf saved_latest && cp -r _site/data/latest saved_latest
      - uses: actions/cache/save@v6
        if: hashFiles('_site/data/latest/manifest.json') != ''
        with:
          path: saved_latest
          key: latest-${{ github.run_id }}

      # 空港の観測（METAR）は棚に戻した（2026-09-29）。取得の仕組みは scripts/fetch_metar.py に残してある

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開だけは一度に一つ（待っている定時の実行が、コード更新の公開を止めないように build 側には付けない）
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        
