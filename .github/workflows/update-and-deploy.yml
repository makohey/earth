# 地球儀：最新の GFS を取りに行き、ページと一緒に GitHub Pages へ出す
# ・リポジトリにはデータをコミットしない（履歴が太らない）
# ・取得に失敗しても公開は続ける（ページはサンプルで動く）
name: データ更新と公開

on:
  schedule:
    # GFS は 00/06/12/18 UTC の実行。+3時間の結果が出そろう頃（約4時間後）に取りに行く
    # GitHub の時間指定は遅れたり飛んだりするので「だいたいその頃」と考える
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:        # 手動で今すぐ実行
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 道具を入れる（GRIB2 を読む eccodes）
        run: pip install eccodes numpy netCDF4

      - name: ページを組み立てる
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          cp -r data _site/

      - name: 最新の GFS（風・降水・気圧）を取得して変換
        continue-on-error: true
        run: python scripts/fetch_gfs.py --out _site/data/latest

      - name: 全球の衛星赤外画像（GMGSI）を、時計の時刻以前で一番新しいものから
        continue-on-error: true
        run: python scripts/fetch_gmgsi.py --latest _site/data/latest

      - name: 最近の地震（USGS、過去7日・M2.5以上）
        continue-on-error: true
        run: python scripts/fetch_quakes.py --latest _site/data/latest

      # 空港の観測（METAR）は棚に戻した（2026-09-29）。取得の仕組みは scripts/fetch_metar.py に残してある

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開だけは一度に一つ（待っている定時の実行が、コード更新の公開を止めないように build 側には付けない）
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        
