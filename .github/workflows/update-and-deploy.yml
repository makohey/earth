# 地球儀：最新の GFS を取りに行き、ページと一緒に GitHub Pages へ出す
# ・リポジトリにはデータをコミットしない（履歴が太らない）
# ・取得に失敗しても公開は続ける（ページはサンプルで動く）
name: データ更新と公開

on:
  schedule:
    # 2時間おきに起きる（GitHub の時間指定は遅れたり飛んだりするので、どれかが飛ばされても次が拾う）。
    # ただし水源へ取りに行くのは「新しい GFS の回が出ていて、まだ取っていない」ときだけ。
    # 前に取った回と同じなら、外へは行かず、公開もせずにすぐ終わる（水源への取得は回ごとに1回＝1日4回のまま）
    - cron: "17 */2 * * *"
  workflow_dispatch:        # 手動・外からの起こし（ルミの予定タスク）。force=true のときだけ、新しい回がなくても取りに行く
    inputs:
      force:
        description: "新しいデータがなくても取りに行く（ふだんは false）"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.reuse.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 道具を入れる（GRIB2 を読む eccodes）
        run: pip install eccodes numpy netCDF4 sgp4

      - name: ページを組み立てる
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          # 版の番号：app.js の中身から短い印を作って index.html の読み込みに付ける。
          # 中身が変わると別のファイル扱いになり、ブラウザが古い app.js を使い回さない（中身が同じなら印も同じなので、むだに読み直さない）
          V=$(sha256sum app.js | cut -c1-10)
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|" _site/index.html
          if grep -q "app.js?v=$V" _site/index.html; then echo "::notice::app.js の版の印: $V"; else echo "::warning::app.js に版の印を付けられませんでした（そのまま公開します）"; fi
          cp -r learn _site/
          cp -r data _site/

      # 同じデータを取り直さない：前回取った「最新データ一式」を置き場（キャッシュ）から戻す。
      # コードを直して送った（push）ときは、6時間以内の一式があればそれを使い、外へは取りに行かない。
      # 定時・手動のときは、いつも通り取りに行く（水源への取得は1日4回のまま）
      - uses: actions/cache/restore@v6
        with:
          path: saved_latest
          key: latest-${{ github.run_id }}
          restore-keys: latest-
      - id: reuse
        name: 取りに行くかどうかを決める
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, shutil
          m = "saved_latest/manifest.json"
          age = None
          if os.path.exists(m):
              g = json.load(open(m, encoding="utf-8")).get("generatedAt")
              if g:
                  age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(g.replace("Z", "+00:00"))).total_seconds() / 3600
          ev, now = os.environ["EVENT"], dt.datetime.now(dt.timezone.utc)
          # いま取れるはずの一番新しい GFS の回（出そろうのは回の約4時間後）
          expect = (now - dt.timedelta(hours=4)).replace(minute=0, second=0, microsecond=0)
          expect = expect.replace(hour=expect.hour - expect.hour % 6)
          have = None
          if os.path.exists(m):
              it = json.load(open(m, encoding="utf-8"))["layers"].get("wind-10m", {}).get("meta", {}).get("issuedTime")
              if it:
                  have = dt.datetime.fromisoformat(it.replace("Z", "+00:00"))
          deploy = True
          if ev == "push":
              hit = age is not None and age < 6
          elif ev == "schedule" or (ev == "workflow_dispatch" and os.environ.get("FORCE", "").lower() != "true"):
              hit = have is not None and have >= expect and age is not None and age < 7
              deploy = not hit                     # 何も新しくないときは、公開もしない（GitHub の定時も、ルミの起こしも同じ）
          else:
              hit = False                          # 手動で force=true のときだけ、いつでも取りに行く
          if hit:
              shutil.copytree("saved_latest", "_site/data/latest")
          cyc = lambda t: t.strftime("%m/%d %HZ") if t else "なし"
          if ev != "push" and hit:
              msg = f"新しい回はまだ（持っている回 {cyc(have)}／次に期待する回 {cyc(expect + dt.timedelta(hours=6))}）。外へも公開も行かずに終わる"
          elif hit:
              msg = f"前回の一式を使う（{age:.1f}時間前に取得・外へは取りに行かない）"
          else:
              msg = "新しく取りに行く" + (f"（持っている回 {cyc(have)}／いま取れるはずの回 {cyc(expect)}）" if have else "（前回の一式なし）")
          who = {"schedule": "GitHub の定時", "workflow_dispatch": "外からの起こし（手動・ルミ）" + ("・強制" if os.environ.get("FORCE", "").lower() == "true" else ""), "push": "コードの更新"}.get(ev, ev)
          print(f"::notice::データ取得: {who} → {msg}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"hit={'true' if hit else 'false'}\ndeploy={'true' if deploy else 'false'}\n")
          PY

      - name: 最新の GFS（風・降水・気圧）を取得して変換
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_gfs.py --out _site/data/latest

      - name: 全球の衛星赤外画像（GMGSI）を、時計の時刻以前で一番新しいものから
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_gmgsi.py --latest _site/data/latest

      - name: 最近の地震（USGS、過去7日・M2.5以上）
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_quakes.py --latest _site/data/latest

      # 海面水温の平年差：日ごとのデータなので、取った日のファイルをキャッシュに残し、同じ日は取り直さない
      - id: today
        if: steps.reuse.outputs.hit != 'true'
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.reuse.outputs.hit != 'true'
        with:
          path: oisst_cache
          key: oisst-${{ steps.today.outputs.day }}
          restore-keys: oisst-
      - name: 海面水温の平年差（NOAA OISST、1日1枚）
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_oisst.py --latest _site/data/latest --cache oisst_cache

      - name: 人工衛星の位置（CelesTrak の軌道要素を5回に分けて取り、SGP4 で計算）
        if: steps.reuse.outputs.hit != 'true'
        continue-on-error: true
        run: python scripts/fetch_sats.py --latest _site/data/latest

      # 火山と揺れの波紋：自分の置き場を持ち、取ったものは取り直さない（同じ月の一覧・同じ日の週報・同じ地震の ShakeMap）。
      # だから push でも走らせてよい（置き場にない新しい分だけを取りに行く）
      - uses: actions/cache/restore@v6
        if: steps.reuse.outputs.deploy == 'true'
        with:
          path: volc_cache
          key: volc-${{ github.run_id }}
          restore-keys: volc-
      - name: 火山（NOAA NCEI の一覧、月1回）
        if: steps.reuse.outputs.deploy == 'true'
        continue-on-error: true
        run: python scripts/fetch_volcanoes.py --latest _site/data/latest --cache volc_cache
      - uses: actions/cache/restore@v6
        if: steps.reuse.outputs.deploy == 'true'
        with:
          path: currents_cache
          key: currents-${{ github.run_id }}
          restore-keys: currents-
      - name: 海流（NOAA AOML 漂流ブイの月平均、月ごとに1回だけ）
        if: steps.reuse.outputs.deploy == 'true'
        continue-on-error: true
        run: python scripts/fetch_currents.py --latest _site/data/latest --cache currents_cache
      - uses: actions/cache/restore@v6
        if: steps.reuse.outputs.deploy == 'true'
        with:
          path: shake_cache
          key: shake-${{ github.run_id }}
          restore-keys: shake-
      - name: 揺れが広がった範囲（USGS ShakeMap、M5以上・新しい地震だけ）
        if: steps.reuse.outputs.deploy == 'true'
        continue-on-error: true
        run: python scripts/fetch_shakemaps.py --latest _site/data/latest --cache shake_cache
      - uses: actions/cache/save@v6
        if: steps.reuse.outputs.deploy == 'true' && hashFiles('volc_cache/*') != ''
        with:
          path: volc_cache
          key: volc-${{ github.run_id }}
      - uses: actions/cache/save@v6
        if: steps.reuse.outputs.deploy == 'true' && hashFiles('currents_cache/*') != ''
        with:
          path: currents_cache
          key: currents-${{ github.run_id }}
      - uses: actions/cache/save@v6
        if: steps.reuse.outputs.deploy == 'true' && hashFiles('shake_cache/*') != ''
        with:
          path: shake_cache
          key: shake-${{ github.run_id }}

      # 一式を置き場に残す（次にコードを送ったとき、これを使う）。push で火山などを足した分も含めて残す。一式が作れなかったときは残さない
      - name: 取った一式を置き場へ
        if: steps.reuse.outputs.deploy == 'true' && hashFiles('_site/data/latest/manifest.json') != ''
        run: rm -rf saved_latest && cp -r _site/data/latest saved_latest
      - uses: actions/cache/save@v6
        if: steps.reuse.outputs.deploy == 'true' && hashFiles('_site/data/latest/manifest.json') != ''
        with:
          path: saved_latest
          key: latest-${{ github.run_id }}

      # 空港の観測（METAR）は棚に戻した（2026-09-29）。取得の仕組みは scripts/fetch_metar.py に残してある

      - uses: actions/configure-pages@v6
        if: steps.reuse.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.reuse.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # 公開だけは一度に一つ（待っている定時の実行が、コード更新の公開を止めないように build 側には付けない）
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        
